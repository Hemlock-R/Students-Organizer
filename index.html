<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- Makes the installed app look native: colored status bar, full screen, no browser bar -->
<meta name="theme-color" content="#0b1b36">
<meta name="description" content="StudyDesk: organize course files, deadlines and weekly reminders.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="StudyDesk">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>StudyDesk – Student Organizer</title>

<!--
  =====================================================================
  STUDYDESK – a single-file student organizer
  =====================================================================
  HOW THIS FILE IS ORGANIZED
    1. <style>   – all the looks (colors, spacing, layout)
    2. <body>    – the empty "shells" of the page (sidebar, views, pop-ups)
    3. <script>  – all the behavior (folders, files, calendar, alerts)

  EASY TWEAKS (no coding knowledge needed)
    • Feedback form . paste your Tally link into APP_INFO.TALLY_FORM_URL
                      (search this file for "PASTE YOUR TALLY LINK HERE")
    • Contact email . APP_INFO.CONTACT_EMAIL (shown in the Privacy policy)
    • Colors ........ edit the values at the top of the <style> block
    • Alert timing .. edit APP_SETTINGS near the top of the <script> block
    • Weekly to-dos . edit EXTRA_WEEKLY_TASKS in APP_SETTINGS
    • Week start .... set WEEK_STARTS_ON_MONDAY to true in APP_SETTINGS

  Your data is saved in your browser (localStorage). Nothing is sent
  anywhere. No internet connection or external libraries are needed.
  =====================================================================
-->

<style>
/* =====================================================================
   1. COLOR & SIZE SETTINGS
   Change a color once here and it updates everywhere in the app.
   ===================================================================== */
:root {
  color-scheme: light dark;

  /* Fixed deep blues used by the sidebar and hero card */
  --navy-900: #0b1b36;
  --navy-800: #12274a;

  /* Page + card colors (light mode) */
  --bg: #eef2f7;            /* page background (soft slate) */
  --surface: #ffffff;       /* card background (crisp white) */
  --surface-2: #f6f8fb;     /* subtle inner panels */
  --text: #17233b;          /* main text */
  --text-muted: #5b6b86;    /* secondary text */
  --border: #dde4ee;        /* card borders & dividers */

  /* Main action color (buttons, links, focus) */
  --primary: #2457d6;
  --on-primary: #ffffff;
  --primary-soft: #e4ecff;
  --focus: #2f6fed;

  /* Status colors: danger = urgent, warn = soon, ok = done */
  --danger: #b4232f;  --danger-bg: #fdecee;  --danger-border: #f4b6bd;
  --warn: #8a4b00;    --warn-bg: #fff3d4;    --warn-border: #efcf83;
  --ok: #176b3c;      --ok-bg: #e2f5ea;      --ok-border: #a9dcbd;

  --hero-bg: #12274a;
  --radius: 14px;
  --shadow: 0 1px 2px rgba(15, 35, 70, .06), 0 4px 14px rgba(15, 35, 70, .04);

  --font: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
}

/* Dark mode: used automatically when the device is set to dark,
   unless the user chose "Light" in Settings. */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b1424;
    --surface: #131f36;
    --surface-2: #1a2946;
    --text: #e8eefb;
    --text-muted: #96a5c3;
    --border: #27385c;
    --primary: #6b9bff;
    --on-primary: #08142e;
    --primary-soft: #1c2f58;
    --focus: #8db0ff;
    --danger: #ff909b;  --danger-bg: #3a1a25;  --danger-border: #6e2c3b;
    --warn: #ffc766;    --warn-bg: #3a2d12;    --warn-border: #6d5422;
    --ok: #75dca0;      --ok-bg: #12341f;      --ok-border: #25603b;
    --hero-bg: #1b3566;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3);
  }
}

/* Dark mode forced from Settings ("Dark") */
:root[data-theme="dark"] {
  color-scheme: dark;
    --bg: #0b1424;
    --surface: #131f36;
    --surface-2: #1a2946;
    --text: #e8eefb;
    --text-muted: #96a5c3;
    --border: #27385c;
    --primary: #6b9bff;
    --on-primary: #08142e;
    --primary-soft: #1c2f58;
    --focus: #8db0ff;
    --danger: #ff909b;  --danger-bg: #3a1a25;  --danger-border: #6e2c3b;
    --warn: #ffc766;    --warn-bg: #3a2d12;    --warn-border: #6d5422;
    --ok: #75dca0;      --ok-bg: #12341f;      --ok-border: #25603b;
    --hero-bg: #1b3566;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3);
}
:root[data-theme="light"] { color-scheme: light; }

/* =====================================================================
   2. BASE RESETS – makes every browser start from the same place
   ===================================================================== */
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  overscroll-behavior-y: none;            /* no pull-to-refresh bounce when installed */
  -webkit-tap-highlight-color: transparent;
  font-family: var(--font);
  font-size: 15px;
  line-height: 1.5;
  color: var(--text);
  background: var(--bg);
}
h1, h2, h3, p { margin: 0; }
ul { list-style: none; margin: 0; padding: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
input, select { font: inherit; color: inherit; }
svg.ic { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }

/* Makes the HTML 'hidden' attribute always win (buttons and fields included) */
[hidden] { display: none !important; }

/* Visible keyboard focus on everything clickable */
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

/* =====================================================================
   3. PAGE LAYOUT – sidebar on the left, content on the right.
   On phones the sidebar turns into a bottom tab bar (see section 14).
   ===================================================================== */
.app { display: grid; grid-template-columns: 236px minmax(0, 1fr); min-height: 100vh; }

/* ---- Sidebar (deep blue navigation) ---- */
.sidebar {
  background: var(--navy-900);
  color: #fff;
  position: sticky; top: 0; height: 100vh;
  display: flex; flex-direction: column;
  padding: 22px 14px;
}
.brand { display: flex; align-items: center; gap: 10px; padding: 0 8px 22px; font-size: 18px; font-weight: 700; letter-spacing: .2px; }
.brand-mark { width: 32px; height: 32px; border-radius: 9px; background: #2f6fed; display: grid; place-items: center; }
.brand-mark svg.ic { width: 18px; height: 18px; stroke-width: 2.6; }

.nav { display: flex; flex-direction: column; gap: 4px; }
.nav button {
  display: flex; align-items: center; gap: 12px;
  width: 100%; padding: 11px 12px;
  background: transparent; border: 0; border-radius: 10px;
  color: #b9c8e6; font-weight: 600; text-align: left;
}
.nav button:hover { background: rgba(255, 255, 255, .07); color: #fff; }
.nav button[aria-current="page"] { background: rgba(255, 255, 255, .14); color: #fff; }

.sidebar-foot { margin-top: auto; padding: 12px 8px 0; font-size: 12.5px; color: #8fa3c9; }
.sidebar-foot button { margin-top: 10px; background: transparent; border: 1px solid rgba(255,255,255,.25); color: #c9d6ee; border-radius: 8px; padding: 6px 10px; font-size: 12.5px; }
.sidebar-foot button:hover { background: rgba(255,255,255,.08); }

/* ---- Main content area ---- */
.main { padding: 28px 34px 60px; max-width: 1320px; width: 100%; }

/* ---- Top bar: page title + quick actions ---- */
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 20px; flex-wrap: wrap; }
.topbar h1 { font-size: 26px; line-height: 1.2; font-weight: 750; letter-spacing: -.2px; }
.topbar .sub { color: var(--text-muted); margin-top: 2px; }
.top-actions { display: flex; align-items: center; gap: 10px; }

/* =====================================================================
   4. BUTTONS
   ===================================================================== */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  padding: 9px 16px; border-radius: 10px; border: 1px solid transparent;
  background: var(--primary); color: var(--on-primary); font-weight: 650;
  transition: filter .12s;
}
.btn:hover { filter: brightness(1.08); }
.btn-ghost { background: var(--surface); color: var(--text); border-color: var(--border); }
.btn-ghost:hover { background: var(--surface-2); filter: none; }
.btn-danger { background: var(--surface); color: var(--danger); border-color: var(--danger-border); }
.btn-danger:hover { background: var(--danger-bg); filter: none; }
.btn-small { padding: 6px 11px; font-size: 13.5px; border-radius: 8px; }

/* Small square icon-only buttons (edit, delete, view…) */
.icon-btn { width: 34px; height: 34px; display: inline-grid; place-items: center; border-radius: 8px; border: 1px solid transparent; background: transparent; color: var(--text-muted); }
.icon-btn:hover { background: var(--surface-2); color: var(--text); border-color: var(--border); }
.icon-btn.danger:hover { background: var(--danger-bg); color: var(--danger); border-color: var(--danger-border); }

/* Notification bell with a count badge */
.bell { position: relative; width: 42px; height: 42px; border-radius: 12px; background: var(--surface); border: 1px solid var(--border); display: grid; place-items: center; }
.bell .count { position: absolute; top: -6px; right: -6px; min-width: 20px; height: 20px; padding: 0 5px; border-radius: 10px; background: #d92d3f; color: #fff; font-size: 12px; font-weight: 700; display: grid; place-items: center; }

/* =====================================================================
   5. CARDS – the white boxes that hold each section
   ===================================================================== */
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px; box-shadow: var(--shadow); }
.card + .card { margin-top: 20px; }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
.card-head h2 { font-size: 17px; font-weight: 700; }
.card-head .hint { color: var(--text-muted); font-size: 13.5px; }
.empty { padding: 22px 12px; text-align: center; color: var(--text-muted); background: var(--surface-2); border-radius: 10px; }
.empty strong { display: block; color: var(--text); margin-bottom: 2px; }
.empty .btn { margin-top: 12px; }

/* =====================================================================
   6. ALERT BANNER (top of every page) + ALERT CENTER LIST
   ===================================================================== */
.banner { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 12px; border: 1px solid; margin-bottom: 18px; }
.banner-danger { background: var(--danger-bg); border-color: var(--danger-border); color: var(--danger); }
.banner-warn   { background: var(--warn-bg);   border-color: var(--warn-border);   color: var(--warn); }
.banner-text { flex: 1; min-width: 0; font-weight: 600; }
.banner-text small { display: block; font-weight: 500; opacity: .9; }
.banner .btn { background: transparent; color: inherit; border-color: currentColor; }

.alert-row { display: flex; align-items: flex-start; gap: 12px; padding: 12px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface-2); }
.alert-row + .alert-row { margin-top: 8px; }
.alert-dot { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; flex: none; }
.alert-danger .alert-dot { background: var(--danger-bg); color: var(--danger); }
.alert-warn   .alert-dot { background: var(--warn-bg);   color: var(--warn); }
.alert-info   .alert-dot { background: var(--primary-soft); color: var(--primary); }
.alert-body { flex: 1; min-width: 0; }
.alert-body strong { display: block; overflow-wrap: anywhere; }
.alert-body span { color: var(--text-muted); font-size: 14px; }
.alert-danger .alert-body span { color: var(--danger); font-weight: 600; }
.alert-warn .alert-body span { color: var(--warn); font-weight: 600; }

/* =====================================================================
   7. DASHBOARD LAYOUT + "NEXT UP" HERO CARD
   ===================================================================== */
.dash { display: grid; grid-template-columns: minmax(0, 1.65fr) minmax(0, 1fr); gap: 20px; align-items: start; }
.dash .card + .card { margin-top: 0; }
.dash-col { display: grid; gap: 20px; }

.hero { background: var(--hero-bg); color: #fff; border-radius: var(--radius); padding: 24px 24px 22px; position: relative; overflow: hidden; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px; }
.hero::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 6px; background: var(--c, #2f6fed); }
.hero-when { font-size: 30px; line-height: 1.15; font-weight: 750; letter-spacing: -.4px; }
.hero-title { margin-top: 6px; font-size: 17px; font-weight: 600; overflow-wrap: anywhere; }
.hero-meta { margin-top: 2px; color: #b9c8e6; font-size: 14.5px; }
.hero.is-danger .hero-when { color: #ffb4bc; }
.hero .btn { background: #fff; color: var(--navy-900); }

/* =====================================================================
   8. DEADLINE LIST ROWS (used on dashboard and calendar page)
   ===================================================================== */
.dl-row { display: grid; grid-template-columns: auto minmax(0, 1fr) auto auto; align-items: center; gap: 12px; padding: 12px 12px 12px 14px; border: 1px solid var(--border); border-left: 5px solid var(--c, var(--primary)); border-radius: 10px; background: var(--surface); }
.dl-row + .dl-row { margin-top: 8px; }
.dl-title { font-weight: 650; overflow-wrap: anywhere; }
.dl-row.is-done .dl-title { text-decoration: line-through; color: var(--text-muted); }
.dl-meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; align-items: center; }
.tag-course { font-size: 12.5px; font-weight: 650; color: var(--text-muted); }
.dl-due { text-align: right; font-weight: 650; font-size: 14px; white-space: nowrap; }
.dl-due small { display: block; font-weight: 500; color: var(--text-muted); font-size: 12.5px; }
.due-danger { color: var(--danger); }
.due-warn { color: var(--warn); }
.due-done { color: var(--ok); }
.row-actions { display: flex; gap: 2px; }

/* Round tick box to mark something done */
.check { width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--border); background: var(--surface); display: grid; place-items: center; padding: 0; color: #fff; }
.check:hover { border-color: var(--primary); }
.check.on { background: var(--ok); border-color: var(--ok); }
.check svg.ic { width: 14px; height: 14px; stroke-width: 3.2; }

/* Small colored label showing the kind of deadline */
.badge { display: inline-block; font-size: 12px; font-weight: 700; padding: 1px 8px; border-radius: 20px; border: 1px solid; }
.type-exam       { color: var(--danger); background: var(--danger-bg); border-color: var(--danger-border); }
.type-quiz       { color: var(--warn);   background: var(--warn-bg);   border-color: var(--warn-border); }
.type-assignment { color: var(--primary); background: var(--primary-soft); border-color: transparent; }
.type-project    { color: var(--ok);     background: var(--ok-bg);     border-color: var(--ok-border); }
.type-other      { color: var(--text-muted); background: var(--surface-2); border-color: var(--border); }

/* =====================================================================
   9. WEEKLY CHECKLIST
   ===================================================================== */
.progress { height: 8px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; margin: 4px 0 14px; }
.progress > div { height: 100%; background: var(--ok); border-radius: 8px; transition: width .25s; }
.todo { display: flex; align-items: flex-start; gap: 12px; padding: 10px 4px; border-top: 1px solid var(--border); }
.todo:first-of-type { border-top: 0; }
.todo-text { flex: 1; min-width: 0; }
.todo-text strong { font-weight: 600; display: block; overflow-wrap: anywhere; }
.todo.is-done .todo-text strong { color: var(--text-muted); text-decoration: line-through; }
.todo-text span { font-size: 13px; color: var(--text-muted); }
.todo-text span.ok { color: var(--ok); font-weight: 600; }
.todo-text span.missing { color: var(--warn); font-weight: 600; }
.todo .btn { align-self: center; }
.sec-label { margin: 14px 0 2px; font-size: 13.5px; font-weight: 700; color: var(--text-muted); }

/* Small folder summary list on the dashboard */
.mini-folder { display: flex; align-items: center; gap: 10px; width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface); text-align: left; }
.mini-folder + .mini-folder { margin-top: 8px; }
.mini-folder:hover { background: var(--surface-2); }
.mini-folder .name { flex: 1; font-weight: 650; }
.mini-folder .num { color: var(--text-muted); font-size: 13.5px; }
.swatch { width: 14px; height: 14px; border-radius: 4px; background: var(--c); flex: none; }

/* =====================================================================
   10. FILES & FOLDERS PAGE
   ===================================================================== */
.files-layout { display: grid; grid-template-columns: 290px minmax(0, 1fr); gap: 20px; align-items: start; }
.files-layout .card + .card { margin-top: 0; }

.folder-item { display: flex; align-items: center; gap: 4px; }
.folder-item + .folder-item { margin-top: 6px; }
.folder-pick { flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface); text-align: left; }
.folder-pick:hover { background: var(--surface-2); }
.folder-pick[aria-pressed="true"] { border-color: var(--primary); background: var(--primary-soft); }
.folder-pick .name { flex: 1; font-weight: 650; overflow-wrap: anywhere; }
.folder-pick .num { font-size: 13px; color: var(--text-muted); }

/* Drag-and-drop upload box */
.dropzone { border: 2px dashed var(--border); border-radius: 12px; padding: 26px 16px; text-align: center; background: var(--surface-2); color: var(--text-muted); cursor: pointer; }
.dropzone:hover, .dropzone.drag-over { border-color: var(--primary); background: var(--primary-soft); color: var(--text); }
.dropzone svg.ic { width: 28px; height: 28px; color: var(--primary); }
.dropzone strong { display: block; color: var(--text); margin-top: 6px; }
.visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.file-row { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface); }
.file-row + .file-row { margin-top: 8px; }
.file-ext { width: 42px; height: 42px; border-radius: 10px; background: var(--primary-soft); color: var(--primary); display: grid; place-items: center; font-size: 11.5px; font-weight: 800; flex: none; }
.file-info { flex: 1; min-width: 0; }
.file-info strong { display: block; font-weight: 650; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.file-info span { font-size: 13px; color: var(--text-muted); }
.folder-title { display: flex; align-items: center; gap: 10px; }
.folder-title h2 { font-size: 20px; }

/* =====================================================================
   11. CALENDAR PAGE
   ===================================================================== */
.cal-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; }
.cal-head h2 { font-size: 20px; min-width: 170px; }
.cal-nav { display: flex; gap: 6px; }
.cal-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); border-top: 1px solid var(--border); border-left: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
.cal-dow { padding: 8px 6px; text-align: center; font-size: 13px; font-weight: 700; color: var(--text-muted); background: var(--surface-2); border-right: 1px solid var(--border); border-bottom: 1px solid var(--border); }
.cell { min-height: 108px; padding: 6px; border-right: 1px solid var(--border); border-bottom: 1px solid var(--border); background: var(--surface); cursor: pointer; }
.cell:hover { background: var(--primary-soft); }
.cell.other { background: var(--surface-2); color: var(--text-muted); }
.daynum { display: inline-grid; place-items: center; min-width: 26px; height: 26px; border-radius: 13px; font-size: 13.5px; font-weight: 650; }
.cell.today .daynum { background: var(--primary); color: var(--on-primary); }
.chips { display: flex; flex-direction: column; gap: 3px; margin-top: 4px; }
.chip { display: block; font-size: 12px; line-height: 1.3; padding: 2px 6px; border-radius: 5px; border-left: 3px solid var(--c); background: var(--surface-2); color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: pointer; }
.cell:hover .chip { background: var(--surface); }
.chip.is-done { opacity: .55; text-decoration: line-through; }
.chip.type-exam-chip { font-weight: 700; }
.more { font-size: 12px; color: var(--text-muted); padding-left: 4px; }

/* =====================================================================
   12. POP-UP WINDOWS (add deadline, new folder, file viewer, confirm)
   ===================================================================== */
dialog { border: 0; border-radius: 16px; padding: 0; width: min(520px, calc(100vw - 24px)); max-height: calc(100vh - 24px); background: var(--surface); color: var(--text); box-shadow: 0 20px 60px rgba(5, 15, 40, .45); }
dialog.wide { width: min(820px, calc(100vw - 24px)); }
dialog::backdrop { background: rgba(8, 20, 45, .6); }
.dlg { padding: 22px; }
.dlg h2 { font-size: 20px; margin-bottom: 14px; }
.dlg-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 18px; flex-wrap: wrap; }
.dlg-actions .spacer { flex: 1; }

.field { display: block; margin-top: 12px; }
.field > span { display: block; font-weight: 650; font-size: 14px; margin-bottom: 4px; }
.field input, .field select { width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface); }
.field input:focus, .field select:focus { border-color: var(--primary); }
.field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.error-text { color: var(--danger); font-weight: 600; font-size: 14px; margin-top: 6px; min-height: 0; }

.swatches { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 6px; }
.swatches label { cursor: pointer; }
.swatches input { position: absolute; opacity: 0; pointer-events: none; }
.swatches .dot { display: block; width: 32px; height: 32px; border-radius: 50%; background: var(--c); border: 3px solid transparent; box-shadow: inset 0 0 0 2px var(--surface); }
.swatches input:checked + .dot { border-color: var(--text); }
.swatches input:focus-visible + .dot { outline: 3px solid var(--focus); outline-offset: 2px; }

.day-list { margin-top: 4px; padding: 10px 12px; border-radius: 10px; background: var(--surface-2); border: 1px solid var(--border); font-size: 14px; }
.day-list strong { display: block; margin-bottom: 4px; }
.day-list li + li { margin-top: 2px; }

.viewer-body { margin-top: 10px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface-2); max-height: 60vh; overflow: auto; }
.viewer-body img { display: block; max-width: 100%; margin: 0 auto; }
.viewer-body iframe { width: 100%; height: 60vh; border: 0; }
.viewer-body pre { margin: 0; padding: 14px; white-space: pre-wrap; word-break: break-word; font-size: 13.5px; }
.viewer-note { padding: 22px; text-align: center; color: var(--text-muted); }
#viewerDownload { display: flex; gap: 8px; flex-wrap: wrap; }
.viewer-note .btn { margin-top: 14px; }

/* Small message that pops up at the bottom after an action */
.toast { position: fixed; left: 50%; bottom: 28px; transform: translate(-50%, 20px); background: var(--navy-900); color: #fff; padding: 10px 18px; border-radius: 10px; font-weight: 600; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; z-index: 50; max-width: calc(100vw - 32px); }
.toast.show { opacity: 1; transform: translate(-50%, 0); }

/* =====================================================================
   12b. VIEW-DEADLINE POP-UP, TAPPABLE ROWS, INSTALL POP-UP
   ===================================================================== */
/* Rows you can tap to open the read-only view */
.dl-row[data-action], .alert-row[data-action] { cursor: pointer; }
.dl-row[data-action]:hover, .alert-row[data-action]:hover { background: var(--surface-2); }

/* Read-only deadline details */
.view-dl { border-left: 6px solid var(--c, var(--primary)); }
.vd-top { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 8px; }
.vd-title { font-size: 22px !important; line-height: 1.25; margin-bottom: 4px !important; overflow-wrap: anywhere; }
.vd-when { font-weight: 700; font-size: 16px; margin-bottom: 14px; }
.vd-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 16px; margin: 0; padding: 14px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px; }
.vd-grid dt { font-size: 13px; color: var(--text-muted); }
.vd-grid dd { margin: 0; font-weight: 650; overflow-wrap: anywhere; }

/* Install pop-up */
.install-steps { margin: 10px 0 0; padding-left: 20px; color: var(--text-muted); }
.install-steps li { margin-top: 6px; }
.install-hero { display: flex; align-items: center; gap: 14px; margin-bottom: 10px; }
.install-hero img { width: 56px; height: 56px; border-radius: 14px; }
.install-hero h2 { margin: 0 !important; }

/* =====================================================================
   12d. NESTED FOLDERS (indented tree, breadcrumbs, subfolder tiles)
   ===================================================================== */
/* Each level of subfolder is pushed in by 18px (the --depth number is set in JavaScript) */
/* ---- MAIN folders vs SUBFOLDERS: they now look clearly different ----
   MAIN folder = raised card, solid colored folder tile, bold larger name, count pill
   SUBFOLDER   = flat and smaller, indented under a colored guide line, outline icon */
.folder-tree .folder-item.is-main { margin-top: 14px; }
.folder-tree .folder-item.is-main:first-child { margin-top: 0; }
.folder-tree .folder-item.is-sub { margin-top: 2px; margin-left: calc(var(--depth, 1) * 14px); padding-left: 8px; border-left: 3px solid var(--c); border-radius: 2px; }
.is-main .folder-pick { padding: 11px 12px; border-radius: 12px; box-shadow: var(--shadow); }
.is-main .folder-pick .name { font-size: 16px; font-weight: 750; }
.is-main .folder-pick .num { background: var(--surface-2); border: 1px solid var(--border); border-radius: 20px; padding: 0 9px; font-weight: 650; color: var(--text); }
.is-sub .folder-pick { padding: 7px 8px; gap: 8px; border: 0; border-radius: 8px; background: transparent; }
.is-sub .folder-pick:hover { background: var(--surface-2); }
.is-sub .folder-pick[aria-pressed="true"] { background: var(--primary-soft); }
.is-sub .folder-pick .name { font-size: 14.5px; font-weight: 550; }
.is-sub .icon-btn { width: 30px; height: 30px; }
.fold-tile { width: 30px; height: 30px; border-radius: 9px; background: var(--c); color: #fff; display: grid; place-items: center; flex: none; }
.fold-tile.sm { width: 26px; height: 26px; border-radius: 8px; }
.fold-tile.big { width: 44px; height: 44px; border-radius: 12px; }
.fold-tile.big svg.ic { width: 22px; height: 22px; }
.fold-mini { color: var(--c); display: grid; place-items: center; flex: none; }
.fold-mini svg.ic { width: 17px; height: 17px; }
.folder-title.is-sub h2 { font-size: 17px; }
.folder-title .kind { display: block; font-size: 13px; font-weight: 600; color: var(--text-muted); }
.subfolder svg.ic { color: var(--c); }
.crumbs { display: flex; flex-wrap: wrap; align-items: center; gap: 2px; margin-bottom: 10px; font-size: 14px; }
.crumb { background: none; border: 0; padding: 3px 6px; color: var(--primary); font-weight: 650; border-radius: 6px; }
.crumb:hover { background: var(--primary-soft); }
.crumb-current { font-weight: 750; padding: 3px 6px; overflow-wrap: anywhere; }
.crumbs .sep { color: var(--text-muted); }
.sub-label { font-size: 13.5px; font-weight: 700; color: var(--text-muted); margin: 0 0 8px; }
.subfolders { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; margin-bottom: 16px; }
.subfolder { display: flex; align-items: center; gap: 10px; padding: 12px; border: 1px solid var(--border); border-left: 5px solid var(--c); border-radius: 10px; background: var(--surface); text-align: left; }
.subfolder:hover { background: var(--surface-2); }
.subfolder .name { flex: 1; min-width: 0; font-weight: 650; overflow-wrap: anywhere; }
.subfolder .num { font-size: 13px; color: var(--text-muted); }
.card-head .head-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

/* =====================================================================
   12c. SETTINGS PAGE (tabs, setting rows, privacy text, feedback frame)
   ===================================================================== */
.settings-wrap { max-width: 780px; }
.tabs { display: flex; gap: 6px; margin-bottom: 18px; overflow-x: auto; border-bottom: 1px solid var(--border); }
.tab { padding: 10px 14px; background: transparent; border: 0; border-bottom: 3px solid transparent; margin-bottom: -1px; font-weight: 650; color: var(--text-muted); white-space: nowrap; }
.tab:hover { color: var(--text); }
.tab[aria-selected="true"] { color: var(--primary); border-bottom-color: var(--primary); }

.set-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 13px 0; border-top: 1px solid var(--border); }
.card-head + .set-row { border-top: 0; }
.set-text { min-width: 0; }
.set-text strong { display: block; font-weight: 650; }
.set-text span { display: block; color: var(--text-muted); font-size: 13.5px; }
.set-ctl { flex: none; display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
.set-ctl select, .set-ctl input[type="time"], .set-ctl input[type="text"] { padding: 9px 12px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface); min-width: 150px; }
.set-row.stack { flex-direction: column; align-items: stretch; }
.set-row.stack .set-ctl { flex: auto; justify-content: stretch; }
.set-row.stack textarea { width: 100%; min-height: 120px; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface); font: inherit; color: inherit; resize: vertical; }

.prose h3 { font-size: 16px; margin: 20px 0 4px; }
.prose h3:first-of-type { margin-top: 6px; }
.prose p, .prose li { color: var(--text-muted); max-width: 70ch; }
.prose ul { list-style: disc; padding-left: 22px; margin: 6px 0 0; }
.prose li + li { margin-top: 4px; }
.prose a { color: var(--primary); }
.prose .lead { color: var(--text); font-size: 16px; font-weight: 600; }
.frame { display: block; width: 100%; height: 680px; border: 0; border-radius: 10px; background: var(--surface-2); margin-top: 12px; }

@media (max-width: 640px) {
  .set-row { flex-direction: column; align-items: stretch; gap: 8px; }
  .set-ctl { justify-content: stretch; }
  .set-ctl select, .set-ctl input[type="time"], .set-ctl input[type="text"] { width: 100%; }
}

/* =====================================================================
   12e. DONATE BUTTON, DONATE BANNER, DONATE FORM
   ===================================================================== */
.btn-donate svg.ic { color: #d6336c; }
@media (max-width: 640px) {
  .btn-donate .btn-label { display: none; }
  .btn-donate { padding: 9px 11px; }
}
/* The polite "Donate or Ignore" card that slides up once in a while */
.donate-banner { position: fixed; right: 20px; bottom: 20px; width: min(390px, calc(100vw - 24px)); display: flex; gap: 12px; align-items: flex-start; padding: 16px; background: var(--surface); color: var(--text); border: 1px solid var(--border); border-radius: 16px; box-shadow: 0 14px 44px rgba(5, 15, 40, .3); z-index: 40; animation: slideUp .35s ease-out; }
.donate-banner[hidden] { display: none; }
.donate-banner .db-text strong { display: block; font-size: 15.5px; }
.donate-banner .db-text span { display: block; color: var(--text-muted); font-size: 14px; margin-top: 2px; }
.donate-banner .db-actions { display: flex; gap: 8px; margin-top: 12px; }
@keyframes slideUp { from { transform: translateY(16px); opacity: 0; } to { transform: none; opacity: 1; } }
@media (max-width: 820px) { .donate-banner { left: 12px; right: 12px; width: auto; bottom: calc(86px + env(safe-area-inset-bottom)); } }
@media (prefers-reduced-motion: reduce) { .donate-banner { animation: none; } }

/* Amount buttons in the donate form */
.amounts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 2px; }
.amounts label { cursor: pointer; }
.field .amounts input[type="radio"] { position: absolute; opacity: 0; width: 1px; height: 1px; padding: 0; pointer-events: none; }
.amounts .amt { display: block; padding: 9px 16px; border: 1px solid var(--border); border-radius: 10px; font-weight: 650; background: var(--surface); }
.amounts input:checked + .amt { border-color: var(--primary); background: var(--primary-soft); color: var(--primary); }
.amounts input:focus-visible + .amt { outline: 3px solid var(--focus); outline-offset: 2px; }
.small-print { font-size: 13px; color: var(--text-muted); margin-top: 10px; }

/* =====================================================================
   12f. WIDGETS (dashboard) + ON/OFF SWITCH (settings)
   ===================================================================== */
.widgets { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; margin-bottom: 20px; }
@media (min-width: 700px) { .widget.wide { grid-column: span 2; } }
.widget { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; box-shadow: var(--shadow); min-width: 0; }
.widget .w-label { font-size: 13px; font-weight: 650; color: var(--text-muted); }
.widget .w-big { font-size: 30px; line-height: 1.15; font-weight: 750; letter-spacing: -.4px; margin-top: 2px; font-variant-numeric: tabular-nums; }
.widget .w-sub { font-size: 13.5px; color: var(--text-muted); overflow-wrap: anywhere; }
.widget.w-dark { background: var(--hero-bg); border-color: transparent; color: #fff; }
.widget.w-dark .w-label, .widget.w-dark .w-sub { color: #b9c8e6; }
.widget.w-click { cursor: pointer; }
.widget.w-click:hover { background: var(--surface-2); }
.w-list { margin-top: 6px; }
.w-item { display: flex; justify-content: space-between; gap: 8px; width: 100%; padding: 7px 0; background: none; border: 0; border-top: 1px solid var(--border); text-align: left; font-size: 14px; }
.w-item:first-child { border-top: 0; }
.w-item small { color: var(--text-muted); white-space: nowrap; }
.w-btns { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
.w-chip { padding: 3px 10px; border-radius: 20px; border: 1px solid var(--border); background: var(--surface); font-size: 12.5px; font-weight: 650; color: var(--text-muted); }
.w-chip.on { background: var(--primary-soft); color: var(--primary); border-color: transparent; }
.widget textarea { width: 100%; min-height: 92px; margin-top: 6px; padding: 9px 11px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface-2); color: inherit; font: inherit; resize: vertical; }
.widget .progress { margin: 10px 0 6px; }
.widget-empty { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding: 14px 16px; margin-bottom: 20px; border: 2px dashed var(--border); border-radius: var(--radius); background: var(--surface-2); }
.widget-empty strong { display: block; }
.widget-empty span { color: var(--text-muted); font-size: 14px; }

.switch { position: relative; display: inline-block; width: 46px; height: 28px; }
.switch input { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: pointer; }
.switch .slider { position: absolute; inset: 0; border-radius: 28px; background: var(--border); transition: background .15s; pointer-events: none; }
.switch .slider::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; transition: transform .15s; box-shadow: 0 1px 3px rgba(0, 0, 0, .3); }
.switch input:checked + .slider { background: var(--primary); }
.switch input:checked + .slider::after { transform: translateX(18px); }
.switch input:focus-visible + .slider { outline: 3px solid var(--focus); outline-offset: 2px; }

/* =====================================================================
   12g. COLLAPSIBLE FOLDER TREE (arrow, "View more")
   ===================================================================== */
.chev { display: grid; place-items: center; color: var(--text-muted); transition: transform .15s; flex: none; }
.chev.open { transform: rotate(180deg); }
.view-more { display: block; margin: 4px 0 0 calc(var(--depth, 0) * 14px + 8px); padding: 5px 10px; background: none; border: 0; border-radius: 6px; color: var(--primary); font-weight: 650; font-size: 13.5px; }
.view-more:hover { background: var(--primary-soft); }

/* =====================================================================
   13. REDUCED MOTION – respect people who turn animations off
   ===================================================================== */
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; scroll-behavior: auto !important; }
}

/* =====================================================================
   14. RESPONSIVE – tablets and phones
   ===================================================================== */
@media (max-width: 1000px) {
  .dash, .files-layout { grid-template-columns: minmax(0, 1fr); }
}

@media (max-width: 820px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  /* Sidebar becomes a bottom tab bar */
  .sidebar { position: fixed; top: auto; bottom: 0; left: 0; right: 0; height: auto; flex-direction: row; padding: 6px 8px calc(6px + env(safe-area-inset-bottom)); z-index: 30; box-shadow: 0 -4px 18px rgba(5, 15, 40, .25); }
  .brand, .sidebar-foot { display: none; }
  .nav { flex-direction: row; width: 100%; gap: 6px; }
  .nav button { flex: 1; flex-direction: column; gap: 2px; padding: 7px 4px; font-size: 12.5px; text-align: center; }
  .main { padding: calc(18px + env(safe-area-inset-top)) 14px 100px; }
  .topbar h1 { font-size: 22px; }
  .toast { bottom: 90px; }
}

@media (max-width: 640px) {
  /* Deadline rows stack so long titles stay readable */
  .dl-row { grid-template-columns: auto minmax(0, 1fr) auto; }
  .dl-due { grid-column: 2 / 3; text-align: left; white-space: normal; }
  .dl-due small { display: inline; margin-left: 6px; }
  .row-actions { grid-column: 3 / 4; grid-row: 1 / 3; flex-direction: column; }
  .hero-when { font-size: 26px; }

  /* Calendar chips shrink to colored dots; full details are in the list below */
  .cell { min-height: 58px; padding: 4px 2px; text-align: center; }
  .chips { flex-direction: row; flex-wrap: wrap; justify-content: center; gap: 3px; }
  .chip { width: 9px; height: 9px; padding: 0; border: 0; border-radius: 50%; background: var(--c); font-size: 0; }
  .more { font-size: 11px; padding: 0; }
  .field-row { grid-template-columns: 1fr; }
}
</style>
</head>

<body>

<!-- =====================================================================
     APP SHELL: sidebar navigation + main content area
     ===================================================================== -->
<div class="app">

  <!-- Sidebar / bottom tab bar. Buttons use data-action="nav" to switch pages -->
  <aside class="sidebar">
    <div class="brand">
      <span class="brand-mark" id="brandMark"></span>
      <span>StudyDesk</span>
    </div>
    <nav class="nav" aria-label="Main">
      <button data-action="nav" data-view="dashboard" id="nav-dashboard"></button>
      <button data-action="nav" data-view="files" id="nav-files"></button>
      <button data-action="nav" data-view="calendar" id="nav-calendar"></button>
      <button data-action="nav" data-view="settings" id="nav-settings"></button>
    </nav>
    <div class="sidebar-foot">
      <div id="storageNote">Saved in this browser only.</div>
      <button data-action="reset-all">Clear all data</button>
    </div>
  </aside>

  <main class="main" id="main">

    <!-- Page title, today's date, bell and "Add deadline" button -->
    <header class="topbar">
      <div>
        <h1 id="pageTitle">Dashboard</h1>
        <p class="sub" id="pageSub"></p>
      </div>
      <div class="top-actions">
        <button class="btn btn-ghost btn-small" data-action="install-app" id="installBtn" hidden></button>
        <button class="bell" data-action="go-alerts" id="bellBtn" aria-label="Alerts"></button>
        <button class="btn btn-ghost btn-donate" data-action="open-donate" id="donateBtn" hidden></button>
        <button class="btn" data-action="add-deadline" id="addDeadlineBtn"></button>
      </div>
    </header>

    <!-- Urgent-deadline banner (filled in by JavaScript) -->
    <div id="bannerArea" aria-live="polite"></div>

    <!-- ============ VIEW 1: DASHBOARD ============ -->
    <section class="view" id="view-dashboard">
      <!-- Widgets the student switched on in Settings -->
      <div id="widgetArea"></div>
      <div class="dash">
        <div class="dash-col">
          <div id="heroArea"></div>
          <div class="card" id="upcomingCard"></div>
        </div>
        <div class="dash-col">
          <div class="card" id="checklistCard"></div>
          <div class="card" id="folderSummaryCard"></div>
        </div>
      </div>
    </section>

    <!-- ============ VIEW 2: FILES & FOLDERS ============ -->
    <section class="view" id="view-files" hidden>
      <div class="files-layout">
        <div class="card" id="folderListCard"></div>
        <div class="card" id="folderDetailCard"></div>
      </div>
    </section>

    <!-- ============ VIEW 3: CALENDAR ============ -->
    <section class="view" id="view-calendar" hidden>
      <div class="card" id="calendarCard"></div>
      <div class="card" id="monthListCard"></div>
    </section>

    <!-- ============ VIEW 4: SETTINGS, FEEDBACK, PRIVACY ============ -->
    <section class="view" id="view-settings" hidden>
      <div id="settingsArea"></div>
    </section>

  </main>
</div>

<!-- Hidden file picker used by the upload box (kept outside the box on purpose) -->
<input type="file" id="fileInput" class="visually-hidden" multiple tabindex="-1" aria-hidden="true">
<!-- Hidden picker used by Settings > Import backup -->
<input type="file" id="importInput" class="visually-hidden" accept="application/json,.json" tabindex="-1" aria-hidden="true">

<!-- Short confirmation message -->
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<!-- =====================================================================
     POP-UP: ADD / EDIT DEADLINE
     ===================================================================== -->
<dialog id="deadlineDialog" aria-labelledby="deadlineDlgTitle">
  <form class="dlg" id="deadlineForm" novalidate>
    <h2 id="deadlineDlgTitle">Add deadline</h2>
    <div id="dayList"></div>

    <label class="field"><span>Title</span>
      <input type="text" id="dlTitle" maxlength="120" placeholder="e.g. Homework 3" required>
    </label>
    <div class="field-row">
      <label class="field"><span>Course</span>
        <select id="dlCourse"></select>
      </label>
      <label class="field"><span>Type</span>
        <select id="dlType"></select>
      </label>
    </div>
    <div class="field-row">
      <label class="field"><span>Due date</span>
        <input type="date" id="dlDate" required>
      </label>
      <label class="field"><span>Time</span>
        <input type="time" id="dlTime">
      </label>
    </div>
    <p class="error-text" id="dlError" role="alert"></p>

    <div class="dlg-actions">
      <button type="button" class="btn btn-danger" id="dlDeleteBtn" data-action="delete-from-modal" hidden>Delete</button>
      <span class="spacer"></span>
      <button type="button" class="btn btn-ghost" data-action="close-dialog">Cancel</button>
      <button type="submit" class="btn">Save deadline</button>
    </div>
  </form>
</dialog>

<!-- =====================================================================
     POP-UP: NEW FOLDER
     ===================================================================== -->
<dialog id="folderDialog" aria-labelledby="folderDlgTitle">
  <form class="dlg" id="folderForm" novalidate>
    <h2 id="folderDlgTitle">New main folder</h2>
    <label class="field"><span>Where should it go?</span>
      <select id="folderParent"></select>
    </label>
    <label class="field"><span>Folder name</span>
      <input type="text" id="folderName" maxlength="40" placeholder="e.g. CICS 111" required>
    </label>
    <div class="field" id="folderColorField"><span>Color</span>
      <div class="swatches" id="folderColors"></div>
    </div>
    <p class="error-text" id="folderError" role="alert"></p>
    <div class="dlg-actions">
      <button type="button" class="btn btn-ghost" data-action="close-dialog">Cancel</button>
      <button type="submit" class="btn">Create folder</button>
    </div>
  </form>
</dialog>

<!-- =====================================================================
     POP-UP: FILE VIEWER
     ===================================================================== -->
<dialog id="viewerDialog" class="wide" aria-labelledby="viewerTitle">
  <div class="dlg">
    <h2 id="viewerTitle">File</h2>
    <div id="viewerMeta" class="sub" style="color:var(--text-muted)"></div>
    <div class="viewer-body" id="viewerBody"></div>
    <div class="dlg-actions">
      <span id="viewerDownload"></span>
      <button type="button" class="btn btn-ghost" data-action="close-dialog">Close</button>
    </div>
  </div>
</dialog>

<!-- =====================================================================
     POP-UP: CONFIRM (used before deleting anything)
     ===================================================================== -->
<dialog id="confirmDialog" aria-labelledby="confirmTitle">
  <div class="dlg">
    <h2 id="confirmTitle">Are you sure?</h2>
    <p id="confirmMsg" style="color:var(--text-muted)"></p>
    <div class="dlg-actions">
      <button type="button" class="btn btn-ghost" data-action="close-dialog">Cancel</button>
      <button type="button" class="btn btn-danger" id="confirmOk">Delete</button>
    </div>
  </div>
</dialog>


<!-- =====================================================================
     POP-UP: VIEW DEADLINE (read-only; use Edit inside to change it)
     ===================================================================== -->
<dialog id="viewDialog" aria-labelledby="vdTitle">
  <div id="viewDlBody"></div>
</dialog>

<!-- =====================================================================
     POP-UP: INSTALL THE APP (filled in by JavaScript)
     ===================================================================== -->
<dialog id="installDialog" aria-labelledby="installTitle">
  <div class="dlg" id="installBody"></div>
</dialog>

<!-- =====================================================================
     POP-UP: WELCOME (asks for the student's name on first open)
     ===================================================================== -->
<dialog id="welcomeDialog" aria-labelledby="welcomeTitle">
  <form class="dlg" id="welcomeForm" novalidate>
    <div class="install-hero"><img alt="" id="welcomeIcon" src=""><h2 id="welcomeTitle">Welcome to StudyDesk</h2></div>

/* Shortcut for document.getElementById. */
function $(id) { return document.getElementById(id); }

/* Makes a short random ID for new folders, files and deadlines. */
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

/* Makes user-typed text safe to place inside HTML (prevents broken layout / injection). */
function esc(s) {
  return String(s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}

/* Adds a leading zero: 5 -> "05". */
function pad(n) { return String(n).padStart(2, '0'); }

/* Turns a Date into "YYYY-MM-DD" (local time). */
function toDateStr(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }

/* Turns "YYYY-MM-DD" back into a Date at midnight (local time). */
function parseDateStr(s) { const p = s.split('-').map(Number); return new Date(p[0], p[1] - 1, p[2]); }

/* Today's date as "YYYY-MM-DD". */
function todayStr() { return toDateStr(new Date()); }

/* How many calendar days from one date string to another (negative = in the past). */
function dayDiff(fromStr, toStr) {
  return Math.round((parseDateStr(toStr) - parseDateStr(fromStr)) / 86400000);
}

/* Returns the Monday of the week that contains a date, as "YYYY-MM-DD".
   The weekly checklist resets every Monday. */
function weekStartStr(date) {
  const d = new Date(date);
  d.setDate(d.getDate() - ((d.getDay() + 6) % 7));
  return toDateStr(d);
}

/* "23:59" -> "11:59 PM". Returns "" when there is no time. */
function formatTime(t) {
  if (!t) return '';
  const p = t.split(':').map(Number);
  const h12 = p[0] % 12 === 0 ? 12 : p[0] % 12;
  return h12 + ':' + pad(p[1]) + ' ' + (p[0] < 12 ? 'AM' : 'PM');
}

/* "2026-10-30" -> "Fri, Oct 30". */
function formatDate(s) {
  return parseDateStr(s).toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });
}

/* 1536000 -> "1.5 MB". */
function formatSize(b) {
  if (b < 1024) return b + ' B';
  if (b < 1048576) return Math.round(b / 1024) + ' KB';
  return (b / 1048576).toFixed(1) + ' MB';
}

/* Gives the short extension shown on a file tile: "lecture.pdf" -> "PDF". */
function fileExt(name) {
  return name.indexOf('.') > -1 ? name.split('.').pop().slice(0, 4).toUpperCase() : 'FILE';
}

/* Finds a folder by its ID (or undefined). */
function folderById(id) { return state.folders.find(function (f) { return f.id === id; }); }

/* ---- Folder tree helpers: main folders have no parentId; subfolders point to their parent ---- */

/* Folders directly inside a parent ('' = the main, top-level folders). */
function childFolders(parentId) {
  return state.folders.filter(function (f) { return (f.parentId || '') === (parentId || ''); });
}

/* The main (top-level) folders. These act as your courses. */
function rootFolders() { return childFolders(''); }

/* Climbs up to the main folder that contains a folder. */
function rootOf(id) {
  let f = folderById(id), guard = 0;
  while (f && f.parentId && guard++ < 20) {
    const p = folderById(f.parentId);
    if (!p) break;
    f = p;
  }
  return f;
}

/* How deep a folder is: 0 = main folder, 1 = subfolder, 2 = sub-subfolder... */
function folderDepth(id) {
  let d = 0, f = folderById(id);
  while (f && f.parentId && d < 20) { f = folderById(f.parentId); d++; }
  return d;
}

/* A folder's id plus the ids of everything inside it, at any depth. */
function descendantIds(id) {
  let out = [id];
  childFolders(id).forEach(function (c) { out = out.concat(descendantIds(c.id)); });
  return out;
}

/* Readable location, e.g. "CICS 111 / Lectures / Week 3". */
function folderPath(id) {
  const parts = [];
  let f = folderById(id), g = 0;
  while (f && g++ < 20) { parts.unshift(f.name); f = f.parentId ? folderById(f.parentId) : null; }
  return parts.join(' / ');
}

/* Number of files in a folder including all its subfolders. */
function fileCountDeep(id) {
  const ids = descendantIds(id);
  return state.files.filter(function (x) { return ids.indexOf(x.folderId) > -1; }).length;
}

/* The course name to display for a deadline. */
function courseName(id) { const f = folderById(id); return f ? f.name : 'General'; }

/* The color to display for a deadline's course. */
function courseColor(id) { const f = rootOf(id); return f ? f.color : '#64748b'; }

/* Shows a short message at the bottom of the screen. */
function toast(msg) {

/* =====================================================================
   D. STORAGE ENGINE – everything is saved in IndexedDB
   ---------------------------------------------------------------------
   IndexedDB is a database built into the browser. It lives on the student's
   own device and holds far more than the old "localStorage" (about 5 MB).
   Our database has two "stores" (think of them as two drawers):
     • "kv"    – small values: folders, deadlines, settings, reminders, notes
     • "files" – the real uploaded files, saved as they are (not as text)

   HOW TO CHANGE THINGS
     • Start completely fresh ...... change DB_NAME below (old data is ignored)
     • Save a new small value ...... kvSet('myKey', anyValue)   and read it with kvGet('myKey', fallback)
     • Save / read / delete a file . putFileBlob(id, file) / getFileBlob(id) / deleteFileBlob(id)
   ===================================================================== */
const DB_NAME = 'studydesk';        // name of the database inside the browser
const DB_VERSION = 1;               // only raise this if you add another "store" in openDatabase()
const STORE_KV = 'kv';              // drawer for small values
const STORE_FILES = 'files';        // drawer for uploaded files

/* The names (keys) of the small values we save in the "kv" drawer. */
const KEY_STATE = 'state';                  // folders, files list, deadlines, checklist ticks, settings
const KEY_UI = 'ui';                        // which folders were left open
const KEY_DONATE = 'donate';                // donate-banner timing
const KEY_NOTE = 'note';                    // the Quick note widget text
const KEY_INSTALL = 'installDismissed';     // when "Install app" was last dismissed
const KEY_INSTALLED = 'appInstalled';       // true once the browser reported the app was installed (hides the Install button)

/* Where older versions of the app kept things (localStorage). Used once, to move
   existing students' data into IndexedDB. Safe to leave as it is. */
const LEGACY_KEYS = {
  state: 'studydesk.v1', ui: 'studydesk.ui', donate: 'studydesk.donate',
  note: 'studydesk.note', installDismissed: 'studydesk.installDismissed'
};

/* Opens (or creates) the database. Resolves with the database, or null if the
   browser doesn't allow IndexedDB (for example some private windows). */
function openDatabase() {
  return new Promise(function (resolve) {
    if (!window.indexedDB) { resolve(null); return; }
    let req;
    try { req = window.indexedDB.open(DB_NAME, DB_VERSION); } catch (e) { resolve(null); return; }
    /* Runs the first time only: creates the two drawers. */
    req.onupgradeneeded = function () {
      const d = req.result;
      if (!d.objectStoreNames.contains(STORE_KV)) d.createObjectStore(STORE_KV);
      if (!d.objectStoreNames.contains(STORE_FILES)) d.createObjectStore(STORE_FILES);
    };
    req.onsuccess = function () { resolve(req.result); };
    req.onerror = function () { resolve(null); };
    req.onblocked = function () { resolve(null); };
  });
}

/* Reads every small value from the database into kvCache (done once at start-up). */
function loadAllValues() {
  return new Promise(function (resolve) {
    if (!db) { resolve(); return; }
    try {
      const req = db.transaction(STORE_KV, 'readonly').objectStore(STORE_KV).openCursor();
      req.onsuccess = function () {
        const cur = req.result;
        if (cur) { kvCache[cur.key] = cur.value; cur.continue(); } else { resolve(); }
      };
      req.onerror = function () { resolve(); };
    } catch (e) { resolve(); }
  });
}

/* Shows a one-time warning if the device refused to save something. */
function storageProblem() {
  storageWorks = false;
  if (!storageWarned) {
    storageWarned = true;
    toast('Couldn\u2019t save to this device. Free up some space and try again.');
  }
}

/* Reads a small saved value (instantly, from the cache). */
function kvGet(key, fallback) {
  return kvCache[key] === undefined ? fallback : kvCache[key];
}

/* Saves a small value. The app keeps working straight away; the database write finishes a moment later. */
function kvSet(key, value) {
  kvCache[key] = value;
  return new Promise(function (resolve) {
    if (!db) { resolve(false); return; }
    try {
      const tx = db.transaction(STORE_KV, 'readwrite');
      tx.objectStore(STORE_KV).put(value, key);
      tx.oncomplete = function () { resolve(true); };
      tx.onerror = tx.onabort = function () { storageProblem(); resolve(false); };
    } catch (e) { storageProblem(); resolve(false); }
  });
}

/* Deletes a small saved value. */
function kvDelete(key) {
  delete kvCache[key];
  return new Promise(function (resolve) {
    if (!db) { resolve(); return; }
    try {
      const tx = db.transaction(STORE_KV, 'readwrite');
      tx.objectStore(STORE_KV).delete(key);
      tx.oncomplete = tx.onerror = tx.onabort = function () { resolve(); };
    } catch (e) { resolve(); }
  });
}

/* Saves an uploaded file. Resolves true if it is safely stored on the device,
   false if it could only be kept in memory for this visit (storage blocked or full). */
function putFileBlob(id, blob) {
  return new Promise(function (resolve) {
    function keepInMemory() { runtimeFiles[id] = blob; resolve(false); }
    if (!db) { keepInMemory(); return; }
    try {
      const tx = db.transaction(STORE_FILES, 'readwrite');
      tx.objectStore(STORE_FILES).put(blob, id);
      tx.oncomplete = function () { resolve(true); };
      tx.onerror = tx.onabort = keepInMemory;
    } catch (e) { keepInMemory(); }
  });
}

/* Reads an uploaded file back. Resolves with the file, or null if it isn't there. */
function getFileBlob(id) {
  if (runtimeFiles[id]) return Promise.resolve(runtimeFiles[id]);
  return new Promise(function (resolve) {
    if (!db) { resolve(null); return; }
    try {
      const req = db.transaction(STORE_FILES, 'readonly').objectStore(STORE_FILES).get(id);
      req.onsuccess = function () { resolve(req.result || null); };
      req.onerror = function () { resolve(null); };
    } catch (e) { resolve(null); }
  });
}

/* Deletes one uploaded file from the database. */
function deleteFileBlob(id) {
  delete runtimeFiles[id];
  return new Promise(function (resolve) {
    if (!db) { resolve(); return; }
    try {
      const tx = db.transaction(STORE_FILES, 'readwrite');
      tx.objectStore(STORE_FILES).delete(id);
      tx.oncomplete = tx.onerror = tx.onabort = function () { resolve(); };
    } catch (e) { resolve(); }
  });
}

/* Deletes every uploaded file from the database. */
function clearAllFileBlobs() {
  Object.keys(runtimeFiles).forEach(function (k) { delete runtimeFiles[k]; });
  return new Promise(function (resolve) {
    if (!db) { resolve(); return; }
    try {
      const tx = db.transaction(STORE_FILES, 'readwrite');
      tx.objectStore(STORE_FILES).clear();
      tx.oncomplete = tx.onerror = tx.onabort = function () { resolve(); };
    } catch (e) { resolve(); }
  });
}

/* Asks the browser not to clear our data when the phone is low on space.
   Installed apps are usually granted this automatically. */
function requestPersistentStorage() {
  if (navigator.storage && navigator.storage.persist) {
    return navigator.storage.persist().catch(function () { return false; });
  }
  return Promise.resolve(false);
}

/* Saves everything (folders, deadlines, settings...). Uploaded files are saved separately by putFileBlob. */
function saveState() {
  kvSet(KEY_STATE, JSON.stringify(state));
  return true;
}

/* Loads the saved data. Returns the data, or null if nothing was saved yet (a brand-new student). */
function loadState() {
  const raw = kvGet(KEY_STATE, null);
  if (!raw) return null;
  try { return normalizeState(JSON.parse(raw)); } catch (e) { return null; }
}

/* True if the old version's example data (CICS 111, MATH 173...) is still sitting untouched. */
function looksLikeDemoData(d) {
  const names = (d.folders || []).map(function (f) { return f && f.name; });
  const titles = (d.deadlines || []).map(function (x) { return x && x.title; });
  const hasAll = function (list, need) { return need.every(function (n) { return list.indexOf(n) > -1; }); };
  return hasAll(names, ['CICS 111', 'MATH 173', 'ENGL 112']) &&
    hasAll(titles, ['Homework 3', 'Quiz 2', 'Essay draft', 'Midterm exam']) && !(d.files || []).length;
}

/* One-time move of data from the old localStorage into IndexedDB (existing students only).
   Example data from older versions is dropped so everyone gets a fresh start. */
async function migrateLegacyStorage() {
  let raw = null;
  try { raw = localStorage.getItem(LEGACY_KEYS.state); } catch (e) { return; }
  if (raw && kvCache[KEY_STATE] === undefined) {
    let data = null;
    try { data = JSON.parse(raw); } catch (e) { data = null; }
    if (data && looksLikeDemoData(data)) data = { settings: data.settings };   // keep preferences, drop the demo
    if (data) {
      /* Older versions kept small files as text inside the data; turn them into real files. */
      const files = Array.isArray(data.files) ? data.files : [];
      for (let i = 0; i < files.length; i++) {
        const f = files[i];
        if (f && typeof f.data === 'string' && f.data.indexOf('data:') === 0) {
          try { await putFileBlob(f.id, await (await fetch(f.data)).blob()); f.stored = true; } catch (e) { f.stored = false; }
        } else if (f) { f.stored = false; }
        if (f) delete f.data;
      }
      await kvSet(KEY_STATE, JSON.stringify(data));
    }
  }
  /* Small values: copy across if we don't have them yet. */
  const pairs = [[LEGACY_KEYS.ui, KEY_UI, true], [LEGACY_KEYS.donate, KEY_DONATE, true], [LEGACY_KEYS.note, KEY_NOTE, false], [LEGACY_KEYS.installDismissed, KEY_INSTALL, 'num']];
  for (let i = 0; i < pairs.length; i++) {
    let v = null;
    try { v = localStorage.getItem(pairs[i][0]); } catch (e) { v = null; }
    if (v !== null && kvCache[pairs[i][1]] === undefined) {
      let val = v;
      if (pairs[i][2] === true) { try { val = JSON.parse(v); } catch (e) { val = {}; } }
      if (pairs[i][2] === 'num') val = Number(v) || 0;
      await kvSet(pairs[i][1], val);
    }
  }
  /* Everything is safely in IndexedDB now: remove the old copies. */
  Object.keys(LEGACY_KEYS).forEach(function (k) { try { localStorage.removeItem(LEGACY_KEYS[k]); } catch (e) { /* ignore */ } });
}

/* Cleans up loaded or imported data so missing or odd values can't break the app.
   Anything that isn't the expected shape is dropped or replaced with a safe default. */
function normalizeState(data) {
  const st = emptyState();
  if (!data || typeof data !== 'object') return st;
  const folders = (Array.isArray(data.folders) ? data.folders : []).filter(function (f) { return f && typeof f.id === 'string' && typeof f.name === 'string'; })
    .map(function (f) { return { id: f.id, name: f.name, parentId: typeof f.parentId === 'string' ? f.parentId : '', color: APP_SETTINGS.FOLDER_COLORS.indexOf(f.color) > -1 ? f.color : APP_SETTINGS.FOLDER_COLORS[0] }; });
  /* Make sure every parent exists and no folder is inside itself (older saves had no parents) */
  const ids = {};
  folders.forEach(function (f) { ids[f.id] = f; });
  folders.forEach(function (f) { if (f.parentId && (!ids[f.parentId] || f.parentId === f.id)) f.parentId = ''; });
  folders.forEach(function (f) {
    let cur = f, steps = 0;
    while (cur && cur.parentId && steps < 50) { cur = ids[cur.parentId]; steps++; }
    if (steps >= 50) f.parentId = '';
  });
  st.folders = folders;
  st.files = (Array.isArray(data.files) ? data.files : []).filter(function (f) { return f && typeof f.id === 'string' && typeof f.name === 'string' && typeof f.folderId === 'string'; })
    .map(function (f) { return { id: f.id, folderId: f.folderId, name: f.name, size: Number(f.size) || 0, type: String(f.type || ''), added: typeof f.added === 'string' ? f.added : new Date().toISOString(), stored: f.stored !== false }; });
  st.files = st.files.filter(function (f) { return !!ids[f.folderId]; });   // drop files whose folder is gone
  st.deadlines = (Array.isArray(data.deadlines) ? data.deadlines : []).filter(function (d) { return d && typeof d.id === 'string' && typeof d.title === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(d.date || ''); })
    .map(function (d) { return { id: d.id, title: d.title, course: String(d.course || ''), type: String(d.type || 'Other'), date: d.date, time: /^\d{2}:\d{2}$/.test(d.time || '') ? d.time : '', done: !!d.done }; });
  st.checklist = (data.checklist && typeof data.checklist === 'object') ? data.checklist : {};
  const set = Object.assign({}, DEFAULT_SETTINGS, data.settings || {});
  if (['system', 'light', 'dark'].indexOf(set.theme) === -1) set.theme = 'system';
  set.name = typeof set.name === 'string' ? set.name.trim().slice(0, 40) : '';
  set.askedName = !!set.askedName;
  set.widgets = (Array.isArray(set.widgets) ? set.widgets : []).filter(function (id, i, arr) {
    return WIDGET_CATALOG.some(function (w) { return w.id === id; }) && arr.indexOf(id) === i;
  });
  if (!Array.isArray(set.extraTasks)) set.extraTasks = DEFAULT_SETTINGS.extraTasks.slice();
  st.settings = set;
  return st;
}

/* =====================================================================
   E. DEADLINE LOGIC – sorting, countdowns, and alerts
   ===================================================================== */

/* Returns all deadlines sorted by date, then time. */
function sortedDeadlines() {
  return state.deadlines.slice().sort(function (a, b) {
    return (a.date + (a.time || '23:59')).localeCompare(b.date + (b.time || '23:59'));
  });
}

/* Deadlines that fall on one specific day. */
function deadlinesOn(dateStr) {
  return sortedDeadlines().filter(function (d) { return d.date === dateStr; });
}

/* Works out how urgent a deadline is. Returns:
   diff    – whole days until due (negative = past)
   overdue – true if the due time has already passed
   level   – 'done' | 'danger' | 'warn' | 'calm'
   label   – friendly text like "Due in 2 days"        */
function dueInfo(d) {
  const diff = dayDiff(todayStr(), d.date);
  const at = d.time ? ' at ' + formatTime(d.time) : '';
  let overdue = diff < 0;
  if (diff === 0 && d.time) {
    const due = parseDateStr(d.date);
    const p = d.time.split(':').map(Number);
    due.setHours(p[0], p[1], 0, 0);
    overdue = new Date() > due;
  }
  if (d.done) return { diff: diff, overdue: false, level: 'done', label: 'Completed' };
  if (overdue) {
    const label = diff < 0 ? 'Overdue by ' + (-diff) + (diff === -1 ? ' day' : ' days') : 'Overdue' + at;
    return { diff: diff, overdue: true, level: 'danger', label: label };
  }
  let label;
  if (diff === 0) label = 'Due today' + at;
  else if (diff === 1) label = 'Due tomorrow' + at;
  else label = 'Due in ' + diff + ' days';
  const level = diff <= APP_SETTINGS.URGENT_DAYS ? 'danger' : (diff <= APP_SETTINGS.SOON_DAYS ? 'warn' : 'calm');
  return { diff: diff, overdue: false, level: level, label: label };
}

/* Counts files added to a folder during the current week. */
function filesThisWeek(folderId) {
  const wk = weekStartStr(new Date());
  const ids = descendantIds(folderId);   // includes files in all subfolders
  return state.files.filter(function (f) {
    return ids.indexOf(f.folderId) > -1 && weekStartStr(new Date(f.added)) === wk;
  }).length;
}

/* Is a weekly checklist item ticked for the current week? */
function isChecked(key) {
  const wk = state.checklist[weekStartStr(new Date())];
  return !!(wk && wk[key]);
}

/* Builds the list of alerts: urgent deadlines, upcoming deadlines, and
   "you haven't uploaded this week's slides" reminders. */
function buildAlerts() {
  const out = [];
  state.deadlines.forEach(function (d) {
    if (d.done) return;
    const info = dueInfo(d);
    if (info.level !== 'danger' && info.level !== 'warn') return;
    out.push({
      id: 'dl:' + d.id + ':' + info.level,
      level: info.level,
      rank: info.overdue ? -1000 + info.diff : info.diff,   // most urgent first
      title: d.title,
      course: courseName(d.course),
      message: info.label + (info.level === 'danger' ? '!' : ''),
      deadlineId: d.id
    });
  });
  out.sort(function (a, b) { return a.rank - b.rank; });

  const wk = weekStartStr(new Date());
  rootFolders().forEach(function (f) {
    if (filesThisWeek(f.id) === 0 && !isChecked('slides:' + f.id)) {
      out.push({
        id: 'slides:' + f.id + ':' + wk,
        level: 'info',
        rank: 9999,
        title: 'No ' + f.name + ' files uploaded this week',
        course: f.name,
        message: 'Have you added this week\u2019s lecture slides?',
        folderId: f.id
      });
    }
  });
  return out;
}

/* The next few open deadlines. */
function renderUpcoming() {
  const open = sortedDeadlines().filter(function (d) { return !d.done; });
  let html = '<div class="card-head"><h2>Upcoming deadlines</h2><button class="btn btn-ghost btn-small" data-action="nav" data-view="calendar">Open calendar</button></div>';
  if (!open.length) {

  } else {
    html += '<ul>' + open.slice(0, 6).map(deadlineRowHTML).join('') + '</ul>';

/* The weekly checklist: slides for every course, plus your extra tasks. */
function renderChecklist() {
  const wk = weekStartStr(new Date());
  const items = [];
  rootFolders().forEach(function (f) {
    const n = filesThisWeek(f.id);
    items.push({
      key: 'slides:' + f.id,
      label: 'Lecture slides uploaded for ' + f.name,
      hint: n ? '<span class="ok">' + n + (n === 1 ? ' file' : ' files') + ' added this week</span>' : '<span class="missing">No files added this week yet</span>',
      folderId: f.id
    });
  });
  const slideCount = items.length;
  APP_SETTINGS.EXTRA_WEEKLY_TASKS.forEach(function (t, i) { items.push({ key: 'extra:' + i, label: t, hint: '' }); });

  const done = items.filter(function (i) { return isChecked(i.key); }).length;
  const pct = items.length ? Math.round(done / items.length * 100) : 0;
  const weekLabel = parseDateStr(wk).toLocaleDateString(undefined, { month: 'short', day: 'numeric' });

  let html = '<div class="card-head"><h2>Weekly check-in</h2><span class="hint">Week of ' + esc(weekLabel) + '</span></div>' +
    '<div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="' + pct + '" aria-label="Weekly checklist progress"><div style="width:' + pct + '%"></div></div>';
  if (!items.length) {
    html += '<div class="empty"><strong>No tasks yet</strong>Create a course folder and its slide reminder will appear here.</div>';
  }
  items.forEach(function (it, idx) {
    if (idx === 0 && slideCount) html += '<p class="sec-label" style="margin-top:0">Did you upload all required slides?</p>';
    if (idx === slideCount && idx > 0) html += '<p class="sec-label">Other weekly habits</p>';
    const on = isChecked(it.key);
    html += '<div class="todo ' + (on ? 'is-done' : '') + '">' +
      '<button class="check ' + (on ? 'on' : '') + '" data-action="toggle-check" data-key="' + esc(it.key) + '" aria-pressed="' + on + '" aria-label="' + esc(it.label) + '">' + (on ? icon('check') : '') + '</button>' +
      '<div class="todo-text"><strong>' + esc(it.label) + '</strong>' + (it.hint ? it.hint : '') + '</div>' +
      (it.folderId && !on ? '<button class="btn btn-ghost btn-small" data-action="goto-folder" data-id="' + esc(it.folderId) + '">Upload</button>' : '') +
      '</div>';
  });
  if (items.length && done === items.length) html += '<p style="margin-top:12px;color:var(--ok);font-weight:650">All done for this week.</p>';
  $('checklistCard').innerHTML = html;
}

/* Loads the list of folders that were left open last time. */
function loadUiPrefs() {
  const p = kvGet(KEY_UI, {}) || {};
  (Array.isArray(p.expanded) ? p.expanded : []).forEach(function (id) { ui.expanded.add(id); });
